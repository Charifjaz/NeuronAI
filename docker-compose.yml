
services:
  backend:
    build: ./backend
    container_name: neuronai-back
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10000s
      timeout: 3s
      retries: 5
  frontend:
    build: ./frontend
    container_name: neuronai-front
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - neuronai-network

