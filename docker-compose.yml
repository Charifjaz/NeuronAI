services:
  db:
    image: postgres:16
    container_name: neuronai-db
    environment:
      POSTGRES_USER: neuronai
      POSTGRES_PASSWORD: neuronai
      POSTGRES_DB: neuronai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - neuronai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuronai"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: neuronai-back
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
    networks:
      - neuronai-network

  frontend:
    build: ./frontend
    container_name: neuronai-front
    environment:
      - API_BASE_URL=http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend
    networks:
      - neuronai-network

networks:
  neuronai-network:
    driver: bridge

volumes:
  postgres_data: