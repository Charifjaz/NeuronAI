services:
  db:
    image: postgres:16
    container_name: neuronai-db
    environment:
      POSTGRES_USER: neuronai
      POSTGRES_PASSWORD: neuronai
      POSTGRES_DB: neuronai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - neuronai-network

  backend:
    build: ./backend
    container_name: neuronai-back
    env_file:
      - ./backend/.env
    # IMPORTANT : dans ton .env, mets un host "db", ex :
    # DATABASE_URL=postgresql://neuronai:neuronai@db:5432/neuronai
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      - db
    networks:
      - neuronai-network

  # frontend:
  #   build: ./frontend
  #   container_name: neuronai-front
  #   ports:
  #     - "3000:80"
  #   depends_on:
  #     - backend
  #   networks:
  #     - neuronai-network

networks:
  neuronai-network:
    driver: bridge

volumes:
  postgres_data:
