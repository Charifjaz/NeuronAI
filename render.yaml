services:
  # Backend
  - type: web
    name: psy-profile-backend
    env: docker
    region: frankfurt  # ou oregon, singapore selon ta localisation
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PORT
        value: 8000

  # Frontend  
  - type: web
    name: psy-profile-frontend
    env: docker
    region: frankfurt
    dockerfilePath: frontend/Dockerfile
    dockerContext: frontend
    envVars:
      - key: REACT_APP_API_URL
        value: https://psy-profile-backend.onrender.com